// Opt-in, headless checks against the actual authored spider geometry.
allprojects {
    afterEvaluate { p ->
        if (p.name == '26.1.2-fabric') {
            // JOML's supported NIO backend avoids its optional sun.misc.Unsafe
            // initialization on Java 25; leave JVM/compiler diagnostics enabled.
            tasks.withType(JavaExec).configureEach {
                if (name in ['checkSpiderIK', 'checkSpiderMovement', 'checkSpiderSupport'])
                    systemProperty 'joml.nounsafe', 'true'
            }
            def compile = tasks.register('compileSpiderSmoke', JavaCompile) {
                dependsOn tasks.named('classes')
                source = rootProject.files('tools/SpiderIKSmoke.java', 'tools/SpiderMovementSmoke.java', 'tools/SpiderSupportSmoke.java')
                classpath = p.sourceSets.main.runtimeClasspath
                destinationDirectory = layout.buildDirectory.dir('spider-smoke')
                javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
            }
            tasks.register('checkSpiderIK', JavaExec) {
                dependsOn compile
                classpath = p.sourceSets.main.runtimeClasspath + files(compile.flatMap { it.destinationDirectory })
                mainClass = 'net.krodark.asterion.update.underworld.client.SpiderIKSmoke'
                workingDir = rootProject.projectDir
                javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            }
            tasks.register('checkSpiderMovement', JavaExec) {
                dependsOn compile
                classpath = p.sourceSets.main.runtimeClasspath + files(compile.flatMap { it.destinationDirectory })
                mainClass = 'net.krodark.asterion.update.underworld.client.SpiderMovementSmoke'
                workingDir = rootProject.projectDir
                javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            }
            tasks.register('checkSpiderSupport', JavaExec) {
                dependsOn compile
                classpath = p.sourceSets.main.runtimeClasspath + files(compile.flatMap { it.destinationDirectory })
                mainClass = 'net.krodark.asterion.update.underworld.client.SpiderSupportSmoke'
                workingDir = rootProject.projectDir
                javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            }
        }
    }
}
