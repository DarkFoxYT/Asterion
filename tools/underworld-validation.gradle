// Opt-in validation; these checks never run during normal gameplay or world generation.
allprojects {
    afterEvaluate { p ->
        if (p.name == '26.1.2-fabric') {
            def smokeCompile = tasks.register('compileUnderworldSmoke', JavaCompile) {
                dependsOn tasks.named('classes')
                source = rootProject.files('tools/UnderworldTerrainSmoke.java', 'tools/LimboShaderSmoke.java',
                        'tools/EmissiveUploadSmoke.java', 'tools/DepthBlitSmoke.java', 'tools/LimboWaterSmoke.java',
                        'tools/AmneticShaderProfile.java', 'tools/WaterVisualSmoke.java', 'tools/ShaderIncludes.java', 'tools/WakeFieldSmoke.java', 'tools/FerryHullSmoke.java', 'tools/AmneticCompatibilitySmoke.java')
                classpath = p.sourceSets.main.runtimeClasspath
                destinationDirectory = layout.buildDirectory.dir('underworld-smoke')
                javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
            }
            tasks.register('checkAmneticCompatibility', JavaExec) {
                dependsOn smokeCompile
                classpath = p.sourceSets.main.runtimeClasspath + files(smokeCompile.flatMap { it.destinationDirectory })
                mainClass = 'AmneticCompatibilitySmoke'
                javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            }
            tasks.register('profileAmneticShaders', JavaExec) {
                dependsOn smokeCompile
                classpath = p.sourceSets.main.runtimeClasspath + files(smokeCompile.flatMap { it.destinationDirectory })
                mainClass = 'AmneticShaderProfile'
                args providers.gradleProperty('shaderProfileOutput').getOrElse('build/reports/amnetic-shaders.csv')
                javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            }
            tasks.register('checkLimboWater', JavaExec) {
                dependsOn smokeCompile
                classpath = p.sourceSets.main.runtimeClasspath + files(smokeCompile.flatMap { it.destinationDirectory })
                mainClass = 'LimboWaterSmoke'
                workingDir = rootProject.projectDir
                javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            }
            tasks.register('checkUnderworldTerrain', JavaExec) {
                dependsOn smokeCompile
                classpath = p.sourceSets.main.runtimeClasspath + files(smokeCompile.flatMap { it.destinationDirectory })
                mainClass = 'UnderworldTerrainSmoke'
                javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            }
            tasks.register('checkUnderworldShaders', JavaExec) {
                dependsOn smokeCompile
                classpath = p.sourceSets.main.runtimeClasspath + files(smokeCompile.flatMap { it.destinationDirectory })
                mainClass = 'LimboShaderSmoke'
                args rootProject.file('src/main/resources/assets/asterion/shaders/post/underworld/river_atmosphere.fsh').absolutePath,
                     rootProject.file('src/main/resources/assets/asterion/shaders/post/underworld/river_composite.fsh').absolutePath,
                     rootProject.file('src/main/resources/assets/asterion/shaders/post/underworld/river_atmosphere_fast.fsh').absolutePath
                javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            }
            tasks.register('checkEmissiveUploads', JavaExec) {
                dependsOn smokeCompile
                classpath = p.sourceSets.main.runtimeClasspath + files(smokeCompile.flatMap { it.destinationDirectory })
                mainClass = 'EmissiveUploadSmoke'
                javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            }
            tasks.register('checkBloomDepth', JavaExec) {
                dependsOn smokeCompile
                classpath = p.sourceSets.main.runtimeClasspath + files(smokeCompile.flatMap { it.destinationDirectory })
                mainClass = 'DepthBlitSmoke'
                javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            }
        }
    }
}
