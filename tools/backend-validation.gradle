allprojects { p ->
    afterEvaluate {
        if (p.name == '26.1.2-fabric') {
            def compile = tasks.register('compileBackendOptimizationSmoke', JavaCompile) {
                dependsOn tasks.named('classes')
                source rootProject.file('tools/BackendOptimizationSmoke.java')
                classpath = p.sourceSets.main.runtimeClasspath
                destinationDirectory = layout.buildDirectory.dir('backend-smoke')
                javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
            }
            tasks.register('checkBackendOptimizations', JavaExec) {
                dependsOn compile
                classpath = p.sourceSets.main.runtimeClasspath + files(compile.flatMap { it.destinationDirectory })
                mainClass = 'BackendOptimizationSmoke'
                javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            }
        }
    }
}
