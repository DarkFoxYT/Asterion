allprojects { p ->
    if (p.name in ['26.2-fabric', '26.3-fabric', '26.2-quilt', '26.3-quilt']) p.afterEvaluate {
        def compile = p.tasks.register('compileNativeRenderingTest', JavaCompile) {
            dependsOn p.tasks.named('classes')
            source p.rootProject.file('tools/NativeRenderingGameTest.java')
            classpath = p.sourceSets.main.runtimeClasspath
            destinationDirectory = p.layout.buildDirectory.dir('native-rendering-test/classes')
            javaCompiler = p.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
        }
        def metadata = p.tasks.register('nativeRenderingTestMetadata') {
            def output = p.layout.buildDirectory.dir('native-rendering-test/resources')
            outputs.dir(output)
            doLast {
                def file = output.get().file('fabric.mod.json').asFile
                file.parentFile.mkdirs()
                file.text = groovy.json.JsonOutput.toJson([schemaVersion: 1, id: 'asterion_native_rendering_test',
                    version: '1.0.0', environment: 'client', entrypoints: ['fabric-client-gametest': ['NativeRenderingGameTest']]])
            }
        }
        def jar = p.tasks.register('nativeRenderingTestJar', Jar) {
            dependsOn compile, metadata
            archiveFileName = 'asterion-native-rendering-test.jar'
            destinationDirectory = p.layout.buildDirectory.dir('native-rendering-test')
            from compile.flatMap { it.destinationDirectory }
            from p.layout.buildDirectory.dir('native-rendering-test/resources')
        }
        if (p.name.endsWith('-quilt')) p.tasks.named('prepareQuiltRunMods', Sync).configure {
            dependsOn jar
            from jar.flatMap { it.archiveFile }
            from(p.configurations.runtimeClasspath) { include 'fabric-client-gametest-api-v1-*.jar' }
        }
        p.tasks.named('runClient', JavaExec).configure {
            dependsOn jar
            jvmArgs '-Dfabric.client.gametest=true'
            jvmArgs '-Dfabric.client.gametest.modid=asterion_native_rendering_test'
            jvmArgs "-Dfabric.addMods=${jar.get().archiveFile.get().asFile.absolutePath}"
        }
    }
}
