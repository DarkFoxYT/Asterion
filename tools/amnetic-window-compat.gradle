// Reproducible, narrow patch to the supplied renderer jars; upstream binaries remain intact.
allprojects {
    afterEvaluate { p ->
        if (p.name == '26.1.2-fabric') {
            def compile = tasks.register('compileAmneticWindowCompatibility', JavaCompile) {
                source = rootProject.fileTree('tools/amnetic-compat') { include '**/*.java' }
                classpath = p.sourceSets.main.compileClasspath
                destinationDirectory = layout.buildDirectory.dir('amnetic-window-compat')
                javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
                options.compilerArgs.add('-proc:none')
            }
            def artifacts = ['amnetic', 'amnetic-neoforge']
            if (providers.gradleProperty('amnetic-forge_input').isPresent()) artifacts.add('amnetic-forge')
            artifacts.each { artifact ->
                tasks.register("patch${artifact.replace('-', '')}Window", Jar) {
                    dependsOn compile
                    def patchVersion = providers.gradleProperty('amnetic_patch_version').getOrElse('1.0.0-asterion.3')
                    archiveFileName = "${artifact}-${patchVersion}.jar"
                    destinationDirectory = rootProject.layout.projectDirectory.dir('libs')
                    preserveFileTimestamps = false
                    reproducibleFileOrder = true
                    def input = providers.gradleProperty("${artifact}_input").getOrElse("libs/${artifact}-1.0-SNAPSHOT-0b72718.jar")
                    from(rootProject.zipTree(rootProject.file(input))) {
                        exclude 'com/meekdev/amnetic/mixin/WindowGlContextMixin.class'
                    }
                    from compile.flatMap { it.destinationDirectory }
                }
            }
            tasks.register('rebuildAmneticWindowCompatibility') {
                dependsOn artifacts.collect { "patch${it.replace('-', '')}Window" }
            }
        }
    }
}
