plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

sourceSets {
    main {
        java {
            srcDir 'src/port/java'
            exclude 'net/krodark/asterion/port/neoforge/**'
            exclude 'net/krodark/asterion/client/**'
            exclude 'net/krodark/asterion/compat/jei/**'
            exclude 'net/krodark/asterion/compat/rei/**'
            exclude 'net/krodark/asterion/compat/jade/**'
            exclude 'net/krodark/asterion/dev/**'
            [
                    'ForgeHudMixin', 'ForgeToastMixin', 'ForgePlayerRendererMixin',
                    'GeckoAnimationCacheMixin', 'GeckoAnimationFrameAccessor',
                    'GeckoTextureCacheLifecycleMixin', 'GeckoInterpolationBufferAccessor',
                    'BossHealthOverlayAccessor', 'MinotaurBossBarMixin', 'MinotaurBodyPickingMixin',
                    'FlamethrowerInputMixin', 'BiomeMusicMixin', 'MoodyBrightnessMixin',
                    'TidalWaterSurfaceMixin', 'AmneticParticleCullingMixin',
                    'AmneticEmissivePassMixin', 'AmneticEmissiveInstanceMixin',
                    'AmneticDepthAttachmentMixin', 'AmneticDepthBlitMixin',
                    'AmneticBloomPerformanceMixin', 'AsterionFogRendererMixin', 'CameraMixin',
                    'CentipedeInteractionMixin', 'FallingBlockRendererMixin',
                    'LevelLoadingScreenMixin', 'RagdollEntityRendererMixin',
                    'RagdollLivingEntityRendererMixin', 'RagdollGeoEntityRendererMixin',
                    'InventoryEntityPreviewMixin', 'RagdollLevelRendererMixin',
                    'SodiumRenderRegionMixin', 'RagdollLocalPlayerMixin',
                    'RagdollItemInHandRendererMixin', 'ForgedTooltipOutlineMixin'
            ].each { exclude "net/krodark/asterion/mixin/${it}.java" }
        }
    }
}

base {
    archivesName = project.archives_base_name
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    ivy {
        name = "LocalRendererDependencies"
        url = uri("libs")
        patternLayout {
            artifact "[artifact]-[revision].[ext]"
            artifact "[artifact].[ext]"
        }
        metadataSources { artifact() }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "GeckoLib"
                url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
            }
        }
        filter {
            includeGroupAndSubgroups "com.geckolib"
            includeGroupAndSubgroups "software.bernie.geckolib"
        }
    }
    maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/releases/" }
    maven { name = "BlameJared"; url = "https://maven.blamejared.com/" }
    maven { name = "Shedaniel"; url = "https://maven.shedaniel.me/" }
    maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation("net.fabricmc:fabric-loader:${project.loader_version}") {
        version { strictly project.loader_version }
    }

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    compileOnly "dev.architectury:architectury-fabric:${project.architectury_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    compileOnly "maven.modrinth:jade:${project.jade_version}"

    modImplementation("foundry.veil:veil-fabric-${project.minecraft_version}:${project.veil_version}") {
        transitive = true
    }
    compileOnly "org.jspecify:jspecify:1.0.0"

}

def resourceProperties = [
        version          : version,
        minecraft_version: minecraft_version,
        loader_version   : loader_version,
        fabric_version   : fabric_version,
        veil_version     : veil_version,
        geckolib_version : geckolib_version
]

processResources {
    from('src/main/resources/assets/asterion/geckolib/models') {
        into 'assets/asterion/geo'
    }
    from('src/main/resources/assets/asterion/geckolib/animations') {
        into 'assets/asterion/animations'
    }
    from('src/main/resources/assets/asterion/textures/armor') {
        include '*_top.png'
        into 'assets/asterion/textures/entity/equipment/humanoid'
        rename { it.replace('_top.png', '.png') }
    }
    from('src/main/resources/assets/asterion/textures/armor') {
        include '*_bottom.png'
        into 'assets/asterion/textures/entity/equipment/humanoid_leggings'
        rename { it.replace('_bottom.png', '.png') }
    }
    inputs.properties resourceProperties
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand resourceProperties
    }

    filesMatching("assets/asterion/sounds/music/**/*.ogg") {
        path = path.toLowerCase(java.util.Locale.ROOT).replaceAll('[^a-z0-9/._-]', '_')
    }
    doLast {
        def sounds = new groovy.json.JsonSlurper().parse(file('src/main/resources/assets/asterion/sounds.json'))
        def tracks = []
        def seen = new HashSet<String>()
        fileTree('src/main/resources/assets/asterion/sounds/music').matching { include '**/*.ogg' }.files.sort().each { track ->
            def group = track.parentFile.name
            if (!(group in ['ancient', 'overgrown', 'crimsonmarshlands', 'arena', 'forge'])) return
            def stem = track.name.substring(0, track.name.length() - 4)
            def split = stem.lastIndexOf(' - ')
            def title = split < 0 ? stem : stem.substring(0, split).trim()
            def artist = split < 0 ? 'Unknown artist' : stem.substring(split + 3).trim()
            def resource = "music/${group}/${stem}".toLowerCase(java.util.Locale.ROOT).replaceAll('[^a-z0-9/._-]', '_')
            if (!seen.add(resource)) throw new GradleException("Duplicate music resource: ${resource}")
            def event = resource.replace('/', '.')
            sounds[event] = [sounds: [[name: "asterion:${resource}", stream: true]]]
            tracks.add([group: group, sound: "asterion:${event}", title: title, artist: artist])
        }
        file("${destinationDir}/assets/asterion/sounds.json").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(sounds))
        file("${destinationDir}/assets/asterion/music_tracks.json").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(tracks))
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.addAll(["-Xlint:deprecation", "-Xlint:unchecked", "-Xmaxerrs", "1000"])
    options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

def bundledLicenseName = "LICENSE_${project.archives_base_name}.txt"

jar {
    exclude 'net/krodark/asterion/dev/**'
    archiveFileName = "${project.archives_base_name}-${project.version}-fabric-mc${project.minecraft_version}.jar"
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest {
        attributes(
                'Implementation-Title': 'Asterion',
                'Implementation-Version': project.version.toString(),
                'Minecraft-Version': project.minecraft_version.toString(),
                'Mod-Loader': 'Fabric'
        )
    }
    from("LICENSE.txt") {
        rename { bundledLicenseName }
    }
}

apply from: 'gradle/forge-assets.gradle'

def essentialRuntimePointer = layout.buildDirectory.file("essential-runtime-jar.path")
tasks.register("stageEssentialRuntimeJar") {
    dependsOn tasks.named("jar")
    def sourceJar = tasks.named("jar", Jar).flatMap { it.archiveFile }
    inputs.file(sourceJar)
    outputs.file(essentialRuntimePointer)
    outputs.upToDateWhen {
        def pointer = essentialRuntimePointer.get().asFile
        pointer.isFile() && file(pointer.text.trim()).isFile()
    }
    doLast {
        def source = sourceJar.get().asFile
        def digest = java.security.MessageDigest.getInstance("SHA-256")
        source.withInputStream { input ->
            input.transferTo(new java.security.DigestOutputStream(java.io.OutputStream.nullOutputStream(), digest))
        }
        def token = java.util.HexFormat.of().formatHex(digest.digest())
        def target = file("run/.asterion-runtime/${token}/${source.name}")
        target.parentFile.mkdirs()
        if (!target.isFile()) java.nio.file.Files.copy(source.toPath(), target.toPath())
        essentialRuntimePointer.get().asFile.text = target.absolutePath
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

}

loom {
    mods {
        asterion { sourceSet sourceSets.main }
    }
    runs {
        client {
            client()
            runDir "run-1.21.1-fabric"
            vmArg '--enable-native-access=ALL-UNNAMED'
            if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_24))
                vmArg '--sun-misc-unsafe-memory-access=allow'
            if (project.hasProperty('startupProfile')) vmArg "-XX:StartFlightRecording=settings=profile,filename=${layout.buildDirectory.file('startup-profile.jfr').get().asFile.absolutePath},dumponexit=true"
            ideConfigGenerated = false
        }
        server {
            server()
            runDir "run-server"
            vmArg '--enable-native-access=ALL-UNNAMED'
            if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_24))
                vmArg '--sun-misc-unsafe-memory-access=allow'
            ideConfigGenerated = false
        }
    }
}

tasks.named("remapJar").configure {
    archiveFileName = "${project.archives_base_name}-${project.version}-fabric-mc${project.minecraft_version}.jar"
}

tasks.withType(JavaExec).configureEach {
    doFirst {
        if (providers.gradleProperty('asterionSafeJvm').getOrElse('false').toBoolean()
                && allJvmArgs.any { it == '-Dfabric.dli.env=client' }) {
            setJvmArgs(jvmArgs.findAll { !it.startsWith('-XX:TieredStopAtLevel=') })
            def safeTier = providers.gradleProperty('asterionSafeJvmTier').getOrElse('1')
            if (!(safeTier in ['1', '3'])) throw new GradleException('asterionSafeJvmTier must be 1 or 3')
            jvmArgs "-XX:TieredStopAtLevel=${safeTier}"
            logger.lifecycle("Asterion client stability mode: C1 tier ${safeTier}; crash-prone C2 tier disabled.")
        }
    }
}

tasks.register("modDistribution", Sync) {
    group = "distribution"
    description = "Stages the combined Asterion mod jar and installation notes."
    dependsOn tasks.named("jar")
    into layout.buildDirectory.dir("distribution")
    from(tasks.named("jar"))
    from("docs/INSTALL-MODS.txt")
}

tasks.register("buildAllLoaders") {
    group = "build"
    description = "Builds the Minecraft 1.21.1 Fabric and NeoForge jars."
    dependsOn tasks.named("build"), project(":neoforge").tasks.named("build")
}
