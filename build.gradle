plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    ivy {
        name = "BundledAmnetic"
        url = uri("libs")
        patternLayout { artifact "[artifact]-[revision].[ext]" }
        metadataSources { artifact() }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "GeckoLib"
                url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
            }
        }
        filter { includeGroupAndSubgroups "com.geckolib" }
    }
    maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "com.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    // The pinned Amnetic build is committed with this project: no sibling checkout, local Maven
    // publication, or machine-specific path is needed. Loom nests it in the distributable JAR.
    implementation "net.krodark:amnetic:1.0-SNAPSHOT"
    include "net.krodark:amnetic:1.0-SNAPSHOT"

}

def resourceProperties = [
        version          : version,
        minecraft_version: minecraft_version,
        loader_version   : loader_version
]

processResources {
    inputs.properties resourceProperties
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand resourceProperties
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.compilerArgs.addAll(["-Xlint:deprecation", "-Xlint:unchecked"])
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

}

tasks.register("rebuildStructureTemplates", JavaExec) {
    group = "asterion"
    description = "Rebuilds editable structure blueprints into vanilla structure-template NBT files."
    dependsOn compileJava
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "net.krodark.asterion.dev.RuinTemplateBuilder"
    args file("src/main/resources/data/asterion/structure/underwater_ruin.nbt").absolutePath
}

tasks.register("rebuildSafeRoomTemplate", JavaExec) {
    group = "asterion"
    dependsOn compileJava
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "net.krodark.asterion.dev.SafeRoomTemplateBuilder"
    args file("src/main/resources/data/asterion/structure/safe_room.nbt").absolutePath
}

tasks.register("rebuildRuneGateTemplate", JavaExec) {
    group = "asterion"
    dependsOn compileJava
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "net.krodark.asterion.dev.RuneGateTemplateBuilder"
    args file("src/main/resources/data/asterion/structure/rune_gate.nbt").absolutePath
}
