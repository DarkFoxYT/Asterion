plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    exclusiveContent {
        forRepository { maven { url = "https://maven.ryanhcode.dev/releases" } }
        filter { includeGroup("foundry.imguimc") }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly "foundry.imguimc:imguimc-fabric-26.1:${project.imguimc_version}"
    compileOnly "io.github.spair:imgui-java-binding:${project.imgui_version}"
    localRuntime "foundry.imguimc:imguimc-fabric-26.1:${project.imguimc_version}"

    compileOnly files("../Amnetic/build/libs/amnetic-1.0-SNAPSHOT.jar")
    localRuntime files("../Amnetic/build/libs/amnetic-1.0-SNAPSHOT.jar")

}

def resourceProperties = [
        version          : version,
        minecraft_version: minecraft_version,
        loader_version   : loader_version
]

processResources {
    inputs.properties resourceProperties
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand resourceProperties
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.compilerArgs.addAll(["-Xlint:deprecation", "-Xlint:unchecked"])
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

}

tasks.register("rebuildStructureTemplates", JavaExec) {
    group = "labyrinth"
    description = "Rebuilds editable structure blueprints into vanilla structure-template NBT files."
    dependsOn compileJava
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "net.krodark.labyrinth.dev.RuinTemplateBuilder"
    args file("src/main/resources/data/labyrinth/structure/underwater_ruin.nbt").absolutePath
}
