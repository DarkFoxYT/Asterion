plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    ivy {
        name = "LocalRendererDependencies"
        url = uri("libs")
        patternLayout {
            artifact "[artifact]-[revision].[ext]"
            artifact "[artifact].[ext]"
        }
        metadataSources { artifact() }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "GeckoLib"
                url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
            }
        }
        filter { includeGroupAndSubgroups "com.geckolib" }
    }
    maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/releases/" }
    maven { name = "BlameJared"; url = "https://maven.blamejared.com/" }
    maven { name = "Shedaniel"; url = "https://maven.shedaniel.me/" }
    maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "com.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

     
    compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    compileOnly "dev.architectury:architectury-fabric:${project.architectury_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    compileOnly "maven.modrinth:jade:${project.jade_version}"

     
    implementation "com.meekdev:amnetic:${project.amnetic_version}"
    include "com.meekdev:amnetic:${project.amnetic_version}"

     
    implementation "asterion.bundled:bb4j:0.0.0-c2242d5"
    include "asterion.bundled:bb4j:0.0.0-c2242d5"

     
    runtimeOnly "org.lwjgl:lwjgl-assimp:3.4.1:natives-linux-arm64"
    include "org.lwjgl:lwjgl-assimp:3.4.1:natives-linux-arm64"

}

def resourceProperties = [
        version          : version,
        minecraft_version: minecraft_version,
        loader_version   : loader_version
]

processResources {
    from('src/main/resources/assets/asterion/textures/armor') {
        include '*_top.png'
        into 'assets/asterion/textures/entity/equipment/humanoid'
        rename { it.replace('_top.png', '.png') }
    }
    from('src/main/resources/assets/asterion/textures/armor') {
        include '*_bottom.png'
        into 'assets/asterion/textures/entity/equipment/humanoid_leggings'
        rename { it.replace('_bottom.png', '.png') }
    }
    inputs.properties resourceProperties
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand resourceProperties
    }
     
    filesMatching("assets/asterion/sounds/music/**/*.ogg") {
        path = path.toLowerCase(java.util.Locale.ROOT).replaceAll('[^a-z0-9/._-]', '_')
    }
    doLast {
        def sounds = new groovy.json.JsonSlurper().parse(file('src/main/resources/assets/asterion/sounds.json'))
        def tracks = []
        def seen = new HashSet<String>()
        fileTree('src/main/resources/assets/asterion/sounds/music').matching { include '**/*.ogg' }.files.sort().each { track ->
            def group = track.parentFile.name
            if (!(group in ['ancient', 'overgrown', 'crimsonmarshlands', 'arena', 'forge'])) return
            def stem = track.name.substring(0, track.name.length() - 4)
            def split = stem.lastIndexOf(' - ')
            def title = split < 0 ? stem : stem.substring(0, split).trim()
            def artist = split < 0 ? 'Unknown artist' : stem.substring(split + 3).trim()
            def resource = "music/${group}/${stem}".toLowerCase(java.util.Locale.ROOT).replaceAll('[^a-z0-9/._-]', '_')
            if (!seen.add(resource)) throw new GradleException("Duplicate music resource: ${resource}")
            def event = resource.replace('/', '.')
            sounds[event] = [sounds: [[name: "asterion:${resource}", stream: true]]]
            tracks.add([group: group, sound: "asterion:${event}", title: title, artist: artist])
        }
        file("${destinationDir}/assets/asterion/sounds.json").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(sounds))
        file("${destinationDir}/assets/asterion/music_tracks.json").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(tracks))
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.addAll(["-Xlint:deprecation", "-Xlint:unchecked"])
    options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        rename { "LICENSE_${project.archives_base_name}.txt" }
    }
}

 
 
 
def forgeAssets = layout.buildDirectory.dir('generated/forge-assets')
def minecraftTextureJar = file("${gradle.gradleUserHomeDir}/caches/fabric-loom/${minecraft_version}/minecraft-client.jar")
tasks.register('generateForgeAssets') {
    inputs.dir('src/main/resources/assets/asterion/textures/forging')
    inputs.file(minecraftTextureJar)
    outputs.dir(forgeAssets)
    doLast {
        def destinationDir = forgeAssets.get().asFile
        def materials = ['bone_steel', 'celestial_bronze', 'celestial_gold', 'celestial_steel',
                         'copper', 'gold', 'iron', 'netherite', 'tarnished_gold']
        def parts = ['blade', 'guard', 'pommel']
        def modelDir = file("${destinationDir}/assets/asterion/models/item")
        def itemDir = file("${destinationDir}/assets/asterion/items")
        def atlasTextureDir = file("${destinationDir}/assets/asterion/textures/item/forging")
        def overlayTextureDir = file("${destinationDir}/assets/asterion/textures/item/forging_overlay")
        modelDir.mkdirs(); itemDir.mkdirs()
        overlayTextureDir.mkdirs()
        def writeHalfAlpha = { java.awt.image.BufferedImage source, File destination ->
            def output = new java.awt.image.BufferedImage(source.width, source.height,
                    java.awt.image.BufferedImage.TYPE_INT_ARGB)
            for (int y = 0; y < source.height; y++) for (int x = 0; x < source.width; x++) {
                int argb = source.getRGB(x, y)
                int alpha = (argb >>> 24) & 255
                output.setRGB(x, y, ((alpha + 1).intdiv(2) << 24) | (argb & 0xFFFFFF))
            }
            destination.parentFile.mkdirs()
            javax.imageio.ImageIO.write(output, 'png', destination)
        }
        def generatedDisplay = [
                ground: [rotation: [0, 0, 0], translation: [0, 2, 0], scale: [0.5, 0.5, 0.5]],
                head: [rotation: [0, 180, 0], translation: [0, 13, 7], scale: [1, 1, 1]],
                thirdperson_righthand: [rotation: [0, 0, 0], translation: [0, 3, 1], scale: [0.55, 0.55, 0.55]],
                thirdperson_lefthand: [rotation: [0, 0, 0], translation: [0, 3, 1], scale: [0.55, 0.55, 0.55]],
                firstperson_righthand: [rotation: [0, -90, 25], translation: [1.13, 3.2, 1.13], scale: [0.68, 0.68, 0.68]],
                firstperson_lefthand: [rotation: [0, 90, -25], translation: [1.13, 3.2, 1.13], scale: [0.68, 0.68, 0.68]],
                fixed: [rotation: [0, 180, 0], scale: [1, 1, 1]]]
        def swordDisplay = generatedDisplay + [
                thirdperson_righthand: [rotation: [0, -90, 55], translation: [0, 4, 0.5], scale: [0.85, 0.85, 0.85]],
                thirdperson_lefthand: [rotation: [0, 90, -55], translation: [0, 4, 0.5], scale: [0.85, 0.85, 0.85]]]
        def layeredModel = { String texture, int layer, boolean sword = false ->
            def parent = sword ? 'asterion:item/forged_sword_layer' : 'minecraft:item/generated'
            if (layer == 0) return [parent: parent,
                    textures: [particle: texture, layer0: texture]]
             
             
             
             
             
            double grow = layer * 0.015D
            [ambientocclusion: false, gui_light: 'front', render_type: 'minecraft:translucent',
             textures: [particle: texture, coating: texture], display: sword ? swordDisplay : generatedDisplay,
             elements: [[from: [-grow, -grow, 7.49D - grow], to: [16D + grow, 16D + grow, 8.51D + grow],
                  
                  
                 faces: [north: [uv: [16, 0, 0, 16], texture: '#coating', tintindex: 0],
                         south: [uv: [0, 0, 16, 16], texture: '#coating', tintindex: 0],
                         west: [uv: [0, 0, 1, 16], texture: '#coating', tintindex: 0],
                         east: [uv: [15, 0, 16, 16], texture: '#coating', tintindex: 0],
                         up: [uv: [0, 0, 16, 1], texture: '#coating', tintindex: 0],
                         down: [uv: [0, 15, 16, 16], texture: '#coating', tintindex: 0]]]]]
        }
        materials.each { material -> parts.each { part ->
            ['','_icon'].each { suffix ->
                (0..<4).each { layer ->
                    def textureName = "${material}_${part}${suffix}"
                    def texture = "asterion:item/forging/${material}/${textureName}"
                    if (layer == 1) {
                        def source = javax.imageio.ImageIO.read(file(
                                "src/main/resources/assets/asterion/textures/forging/${material}/${textureName}.png"))
                        writeHalfAlpha(source, file("${overlayTextureDir}/${material}/${textureName}.png"))
                    }
                    if (layer > 0) texture = "asterion:item/forging_overlay/${material}/${textureName}"
                    file("${modelDir}/forge_${material}_${part}${suffix}_layer${layer}.json").text =
                            groovy.json.JsonOutput.toJson(layeredModel(texture, layer, suffix == ''))
                }
            }
        }}
        def selectLayer = { String part, boolean icon, int stringIndex, int colorIndex, int renderLayer ->
            [type: 'minecraft:select', property: 'minecraft:custom_model_data', index: stringIndex,
             cases: materials.collect { material ->
                 [when: material, model: [type: 'minecraft:model',
                     model: "asterion:item/forge_${material}_${part}${icon ? '_icon' : ''}_layer${renderLayer}"]]
             }, fallback: renderLayer == 0
                    ? [type: 'minecraft:model', model: "asterion:item/forge_iron_${part}${icon ? '_icon' : ''}_layer0"]
                    : [type: 'minecraft:empty']]
        }
        parts.each { part ->
            def layers = (0..<4).collect { layer -> selectLayer(part, true, layer, layer, layer) }
            file("${itemDir}/forged_sword_${part}.json").text = groovy.json.JsonOutput.toJson(
                    [model: [type: 'minecraft:composite', models: layers]])
        }
         
        def swordLayers = [[type: 'minecraft:model', model: 'asterion:item/forged_sword_handle']]
        parts.eachWithIndex { part, partIndex ->
            (0..<4).each { layer ->
                int index = partIndex * 4 + layer
                swordLayers.add(selectLayer(part, false, index, index, layer))
            }
        }
        file("${itemDir}/forged_sword.json").text = groovy.json.JsonOutput.toJson(
                [model: [type: 'minecraft:composite', models: swordLayers]])

         
         
        def ingotTextures = materials.collectEntries { material ->
            def custom = file("src/main/resources/assets/asterion/textures/forging/${material}/${material}_ingot.png")
            [(material): custom.exists()
                    ? "asterion:item/forging/${material}/${material}_ingot"
                    : "minecraft:item/${material == 'tarnished_gold' ? 'gold' : material}_ingot"]
        }
        def minecraftClientZip = new java.util.zip.ZipFile(minecraftTextureJar)
        materials.each { material ->
            (0..<4).each { layer ->
                def texture = ingotTextures[material]
                if (layer == 1) {
                    java.awt.image.BufferedImage source
                    def custom = file("src/main/resources/assets/asterion/textures/forging/${material}/${material}_ingot.png")
                    if (custom.exists()) source = javax.imageio.ImageIO.read(custom)
                    else {
                        def vanilla = material == 'tarnished_gold' ? 'gold' : material
                        def entry = minecraftClientZip.getEntry("assets/minecraft/textures/item/${vanilla}_ingot.png")
                        source = entry == null ? null : javax.imageio.ImageIO.read(minecraftClientZip.getInputStream(entry))
                    }
                    if (source == null) throw new GradleException("Cannot resolve forge ingot texture for ${material}")
                    writeHalfAlpha(source, file("${overlayTextureDir}/${material}/${material}_ingot.png"))
                }
                if (layer > 0) texture = "asterion:item/forging_overlay/${material}/${material}_ingot"
                file("${modelDir}/forge_${material}_ingot_layer${layer}.json").text =
                        groovy.json.JsonOutput.toJson(layeredModel(texture, layer))
            }
        }
        minecraftClientZip.close()
        def ingotLayers = (0..<4).collect { layer ->
            [type: 'minecraft:select', property: 'minecraft:custom_model_data', index: layer,
             cases: materials.collect { material ->
                 [when: material, model: [type: 'minecraft:model',
                     model: "asterion:item/forge_${material}_ingot_layer${layer}"]]
             }, fallback: layer == 0
                    ? [type: 'minecraft:model', model: 'asterion:item/forge_iron_ingot_layer0']
                    : [type: 'minecraft:empty']]
        }
        file("${itemDir}/forged_ingot.json").text = groovy.json.JsonOutput.toJson(
                [model: [type: 'minecraft:composite', models: ingotLayers]])
        copy {
            from file('src/main/resources/assets/asterion/textures/forging')
            into atlasTextureDir
        }
    }
}

 
 
 
tasks.named('processResources').configure {
    dependsOn tasks.named('generateForgeAssets')
    inputs.dir(forgeAssets)
    doLast {
        copy {
            from forgeAssets
            into destinationDir
        }
    }
}

def essentialRuntimePointer = layout.buildDirectory.file("essential-runtime-jar.path")
tasks.register("stageEssentialRuntimeJar") {
    dependsOn tasks.named("jar")
    def sourceJar = tasks.named("jar", Jar).flatMap { it.archiveFile }
    inputs.file(sourceJar)
    outputs.file(essentialRuntimePointer)
    outputs.upToDateWhen {
        def pointer = essentialRuntimePointer.get().asFile
        pointer.isFile() && file(pointer.text.trim()).isFile()
    }
    doLast {
        def source = sourceJar.get().asFile
        def digest = java.security.MessageDigest.getInstance("SHA-256")
        source.withInputStream { input ->
            input.transferTo(new java.security.DigestOutputStream(java.io.OutputStream.nullOutputStream(), digest))
        }
        def token = java.util.HexFormat.of().formatHex(digest.digest())
        def target = file("run/.asterion-runtime/${token}/${source.name}")
        target.parentFile.mkdirs()
        if (!target.isFile()) java.nio.file.Files.copy(source.toPath(), target.toPath())
        essentialRuntimePointer.get().asFile.text = target.absolutePath
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

}

loom {
    mods {
        asterion { sourceSet sourceSets.main }
    }
    runs {
        client {
            mainClass = "net.krodark.asterion.dev.EssentialClientLaunch"
            vmArg "-Dasterion.essential.modJarPathFile=${essentialRuntimePointer.get().asFile.absolutePath}"
            if (project.hasProperty('startupSmokeTest')) vmArg '-Dasterion.startup.smokeTest=true'
            if (project.hasProperty('startupProfile')) vmArg "-XX:StartFlightRecording=settings=profile,filename=${layout.buildDirectory.file('startup-profile.jfr').get().asFile.absolutePath},dumponexit=true"
            ideConfigGenerated = false
        }
        essentialClient {
            client()
            name = "Minecraft Client with Essential"
            vmArg "-Dasterion.essential.modJarPathFile=${essentialRuntimePointer.get().asFile.absolutePath}"
             
             
            mainClass = "net.krodark.asterion.dev.EssentialClientLaunch"
            runDir "run"
            ideConfigGenerated = false
        }
        essentialTest {
            client()
            name = "Essential integration test"
            vmArg "-Dasterion.essential.modJarPathFile=${essentialRuntimePointer.get().asFile.absolutePath}"
            mainClass = "net.krodark.asterion.dev.EssentialClientLaunch"
            vmArg "-Dasterion.essential.smokeTest=true"
            vmArg "-Dfabric.addMods=${fileTree('run/mods').matching { include '*.jar' }.files.collect { it.absolutePath }.join(File.pathSeparator)}"
            runDir "build/essential-gametest"
            ideConfigGenerated = false
        }
        renderPerformanceTest {
            client()
            name = "Renderer performance integration test"
            vmArg "-Dfabric.client.gametest"
            vmArg "-Dfabric.client.gametest.modid=asterion_renderer_test"
            vmArg "-Dfabric.addMods=${layout.buildDirectory.dir('renderer-testmod').get().asFile.absolutePath}"
            runDir "build/renderer-gametest"
            ideConfigGenerated = false
        }
        lamenterTest {
            client()
            name = "Lamenter integration test"
            vmArg "-Dfabric.client.gametest"
            vmArg "-Dfabric.client.gametest.modid=asterion_lamenter_test"
            vmArg "-Dfabric.addMods=${layout.buildDirectory.dir('lamenter-testmod').get().asFile.absolutePath}"
            runDir "build/lamenter-gametest"
            ideConfigGenerated = false
        }
        runePuzzleTest {
            client()
            name = "Rune puzzle integration test"
            vmArg "-Dfabric.client.gametest"
            vmArg "-Dfabric.client.gametest.modid=asterion_rune_puzzle_test"
            vmArg "-Dfabric.addMods=${layout.buildDirectory.dir('rune-puzzle-testmod').get().asFile.absolutePath}"
            runDir "build/rune-puzzle-gametest"
            ideConfigGenerated = false
        }
        barrelDoorTest {
            client()
            name = "Barrel door integration test"
            vmArg "-Dfabric.client.gametest"
            vmArg "-Dfabric.client.gametest.modid=asterion_barrel_door_test"
            vmArg "-Dfabric.addMods=${layout.buildDirectory.dir('barrel-door-testmod').get().asFile.absolutePath}"
            runDir "build/barrel-door-gametest"
            ideConfigGenerated = false
        }
        catacombTest {
            vmArg "-Dasterion.audit.tests=${providers.gradleProperty('auditTests').getOrElse('')}"
            client()
            name = "Catacomb layout integration test"
            vmArg "-Dfabric.client.gametest"
            vmArg "-Dfabric.client.gametest.modid=asterion_catacomb_test"
            vmArg "-Dfabric.addMods=${layout.buildDirectory.dir('catacomb-testmod').get().asFile.absolutePath}"
            runDir providers.gradleProperty('catacombTestDir').getOrElse('build/catacomb-gametest')
            ideConfigGenerated = false
        }
        doorTest {
            client()
            name = "Door integration test"
            if (project.hasProperty("pillarOnly")) vmArg "-Dasterion.pillarTest=true"
            vmArg "-Dfabric.client.gametest"
            vmArg "-Dfabric.client.gametest.modid=asterion"
            runDir "build/door-gametest"
            ideConfigGenerated = false
        }
        heavyWaterTest {
            client()
            name = "Heavy Water and maze event integration test"
            vmArg "-Dfabric.client.gametest"
            vmArg "-Dfabric.client.gametest.modid=asterion_heavy_water_test"
            vmArg "-Dfabric.addMods=${layout.buildDirectory.dir('heavy-water-testmod').get().asFile.absolutePath}"
            runDir "build/heavy-water-gametest"
            ideConfigGenerated = false
        }
        biomeTest {
            client()
            name = "Biome feature integration test"
            vmArg "-Dfabric.client.gametest"
            vmArg "-Dfabric.client.gametest.modid=asterion_biome_test"
            vmArg "-Dfabric.addMods=${layout.buildDirectory.dir('biome-testmod').get().asFile.absolutePath}"
            runDir "build/biome-gametest"
            ideConfigGenerated = false
        }
    }
}

