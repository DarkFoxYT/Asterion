plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
// Stonecutter owns project groups to distinguish version nodes.

base {
    archivesName = project.archives_base_name
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    maven {
        name = "RyanHCode"
        url = "https://maven.ryanhcode.dev/releases"
        content { includeGroup "foundry.imguimc" }
    }
    ivy {
        name = "LocalRendererDependencies"
        url = rootProject.uri("libs")
        patternLayout {
            artifact "[artifact]-[revision].[ext]"
            artifact "[artifact].[ext]"
        }
        metadataSources { artifact() }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "GeckoLib"
                url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
            }
        }
        filter { includeGroupAndSubgroups "com.geckolib" }
    }
    maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/releases/" }
    maven { name = "BlameJared"; url = "https://maven.blamejared.com/" }
    maven { name = "Shedaniel"; url = "https://maven.shedaniel.me/" }
    maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
    maven { name = "Quilt"; url = "https://maven.quiltmc.org/repository/release" }
}

def loaderPlatform = project.name.tokenize("-").last()
if (!(loaderPlatform in ["fabric", "quilt"])) {
    throw new GradleException("Unsupported loader_platform '${loaderPlatform}'. Expected 'fabric' or 'quilt'.")
}

if (loaderPlatform == "quilt") {
    configurations.configureEach {
        // Quilt Loader supplies Fabric Loader's compatibility API. Keeping a
        // transitive, signed Fabric Loader jar beside it causes split-package
        // signer failures before Knot can start.
        exclude group: "net.fabricmc", module: "fabric-loader"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (loaderPlatform == "quilt") {
        implementation "org.quiltmc:quilt-loader:${project.quilt_loader_version}"
        implementation "org.quiltmc:quilt-loader-dependencies:${project.quilt_loader_version}"
    } else {
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    }

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "com.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    compileOnly "dev.architectury:architectury-fabric:${project.architectury_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    compileOnly "maven.modrinth:jade:${project.jade_version}"

    implementation "com.meekdev:amnetic:${project.amnetic_version}"
    include "com.meekdev:amnetic:${project.amnetic_version}"

    // Amnetic keeps its editor optional for production, but an IDE client should
    // have the ImGui host available so the Right Shift editor shortcut works.
    // runtimeOnly deliberately keeps ImGuiMC out of Asterion's distributable jar.
    if (!(project.minecraft_version in ['26.2', '26.3'])) {
        runtimeOnly "foundry.imguimc:imguimc-fabric-26.1:${project.imguimc_version}"
    }

    implementation "asterion.bundled:bb4j:0.0.0-c2242d5"
    include "asterion.bundled:bb4j:0.0.0-c2242d5"

    runtimeOnly "org.lwjgl:lwjgl-assimp:3.4.1:natives-linux-arm64"
    include "org.lwjgl:lwjgl-assimp:3.4.1:natives-linux-arm64"

}

def resourceProperties = [
        version          : version,
        minecraft_version: minecraft_version,
        loader_version   : loader_version
]

processResources {
    if (project.minecraft_version in ['26.2', '26.3']) {
        doLast {
            if (project.minecraft_version == '26.2') {
                fileTree("${destinationDir}/data/asterion/advancement").matching { include '**/*.json' }.each { resource ->
                    def advancement = new groovy.json.JsonSlurper().parse(resource)
                    advancement.criteria?.values()?.each { criterion ->
                        def entity = criterion.conditions?.entity
                        if (criterion.trigger == 'minecraft:player_killed_entity' && entity) {
                            def predicates = entity instanceof List ? entity.collect { it.predicate } : [entity]
                            predicates.each { predicate ->
                                if (predicate?.containsKey('type')) predicate['minecraft:entity_type'] = predicate.remove('type')
                            }
                        }
                    }
                    resource.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(advancement))
                }
            }
            fileTree("${destinationDir}/assets/asterion/shaders/post").matching { include '**/*.fsh' }.each { shader ->
                def source = shader.getText('UTF-8')
                def newline = source.indexOf('\n') + 1
                shader.setText(source.substring(0, newline) + '#define ASTERION_REVERSED_DEPTH\n' + source.substring(newline), 'UTF-8')
            }
        }
    }
    if (project.minecraft_version == '26.3') {
        eachFile {
            if (path.startsWith('data/asterion/worldgen/configured_feature/')) {
                path = path.replace('/configured_feature/', '/feature/')
            }
        }
        doLast {
            fileTree("${destinationDir}/data/asterion/advancement").matching { include '**/*.json' }.each { resource ->
                def advancement = new groovy.json.JsonSlurper().parse(resource)
                advancement.criteria?.values()?.each { criterion ->
                    def conditions = criterion.conditions
                    if (criterion.trigger == 'minecraft:recipe_unlocked' && conditions?.containsKey('recipe')) {
                        conditions.recipes = conditions.remove('recipe')
                    }
                    if (criterion.trigger == 'minecraft:player_killed_entity' && conditions?.entity) {
                        def entity = conditions.entity
                        if (entity instanceof List) {
                            if (entity.size() != 1) throw new GradleException("Unsupported compound entity predicate: ${resource.name}")
                            entity = entity[0]
                            entity.type = entity.remove('condition')
                            if (entity.predicate?.containsKey('type')) entity.predicate['minecraft:entity_type'] = entity.predicate.remove('type')
                        } else {
                            entity = [type: 'minecraft:entity_properties', entity: 'this', predicate: ['minecraft:entity_type': entity.type]]
                        }
                        conditions.entity = entity
                    }
                }
                resource.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(advancement))
            }
            fileTree("${destinationDir}/data/asterion/worldgen/feature").matching { include '**/*.json' }.each { resource ->
                def feature = new groovy.json.JsonSlurper().parse(resource)
                if (feature.config != [:]) throw new GradleException("Feature migration requires a configured codec: ${resource.name}")
                feature.remove('config')
                resource.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(feature))
            }
            def shaders = file("${destinationDir}/assets/asterion/shaders")
            fileTree(shaders).matching { include 'core/*', 'include/*' }.each { shader ->
                shader.text = shader.getText('UTF-8').replace('#moj_import', '#include')
            }
            def locations = [Position: 0, Color: 1, UV0: 2, UV1: 3, UV2: 4, Normal: 5]
            def waterVertex = new File(shaders, 'core/limbo_water.vsh')
            def varyings = [:]
            (waterVertex.text =~ /(?m)^out\s+\w+\s+(\w+)\s*;/).each { match -> varyings[match[1]] = varyings.size() }
            ['limbo_water.vsh', 'limbo_water.fsh', 'enhanced_emissive.fsh'].each { name ->
                def shader = new File(shaders, "core/${name}")
                def text = shader.getText('UTF-8').replace('#version 330', '#version 330\n#extension GL_ARB_separate_shader_objects : require')
                def entityVaryings = [sphericalVertexDistance: 0, cylindricalVertexDistance: 1, vertexColor: 2, texCoord0: 6]
                text = text.replaceAll(/(?m)^(in|out)\s+(\w+)\s+(\w+)\s*;/) { declaration, direction, type, variable ->
                    def location = name == 'enhanced_emissive.fsh' ? entityVaryings[variable]
                            : (name.endsWith('.vsh') && direction == 'in' ? locations[variable] : varyings[variable])
                    if (direction == 'out' && name.endsWith('.fsh')) location = 0
                    if (location == null) throw new GradleException("Missing shader location: ${name} ${variable}")
                    "layout(location = ${location}) ${direction} ${type} ${variable};"
                }
                shader.setText(text, 'UTF-8')
            }
        }
    }
    from(rootProject.file('src/main/resources/assets/asterion/textures/armor')) {
        include '*_top.png'
        into 'assets/asterion/textures/entity/equipment/humanoid'
        rename { it.replace('_top.png', '.png') }
    }
    from(rootProject.file('src/main/resources/assets/asterion/textures/armor')) {
        include '*_bottom.png'
        into 'assets/asterion/textures/entity/equipment/humanoid_leggings'
        rename { it.replace('_bottom.png', '.png') }
    }
    inputs.properties resourceProperties
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand resourceProperties
    }

    filesMatching("assets/asterion/sounds/music/**/*.ogg") {
        path = path.toLowerCase(java.util.Locale.ROOT).replaceAll('[^a-z0-9/._-]', '_')
    }
    doLast {
        def sounds = new groovy.json.JsonSlurper().parse(rootProject.file('src/main/resources/assets/asterion/sounds.json'))
        def tracks = new groovy.json.JsonSlurper().parse(rootProject.file('src/main/resources/assets/asterion/music_tracks.json'))
        def seen = new HashSet<String>()
        tracks.each { track ->
            if (!(track.sound instanceof String) || !track.sound.startsWith('asterion:'))
                throw new GradleException("Invalid authored music sound: ${track.sound}")
            def event = track.sound.substring('asterion:'.length())
            if (!seen.add(event) || !sounds.containsKey(event) || !track.title || !track.artist)
                throw new GradleException("Missing or duplicate music credits for ${event}")
            // Filenames are resource identifiers; authored credits are the display names.
            def declaration = sounds[event]
            declaration.sounds = declaration.sounds.collect { sample ->
                sample instanceof String ? [name: sample, stream: true] : sample + [stream: true]
            }
            if (!declaration.subtitle) throw new GradleException("Music subtitle missing: ${event}")
        }
        file("${destinationDir}/assets/asterion/sounds.json").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(sounds))
        file("${destinationDir}/assets/asterion/music_tracks.json").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(tracks))
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.addAll(["-Xlint:deprecation", "-Xlint:unchecked"])
    if (project.minecraft_version in ['26.2', '26.3']) options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
    options.release.set(targetJavaVersion)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

def licenseArchiveName = "LICENSE_${project.archives_base_name}.txt"
jar {
    exclude 'net/krodark/asterion/dev/**'
    archiveFileName = "${project.archives_base_name}-${project.version}-${loaderPlatform}-mc${project.minecraft_version}.jar"
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest {
        attributes(
                'Implementation-Title': 'Asterion',
                'Implementation-Version': project.version.toString(),
                'Minecraft-Version': project.minecraft_version.toString(),
                'Mod-Loader': loaderPlatform == 'quilt' ? 'Quilt' : 'Fabric'
        )
    }
    from(rootProject.file("LICENSE.txt")) {
        rename { licenseArchiveName }
    }
}

if (loaderPlatform == "quilt") {
    def prepareQuiltRunMods = tasks.register("prepareQuiltRunMods", Sync) {
        dependsOn tasks.named("jar")
        from tasks.named("jar", Jar).flatMap { it.archiveFile }
        from(configurations.runtimeClasspath) {
            include "fabric-api-*.jar"
            include "geckolib-fabric-*.jar"
            include "modmenu-*.jar"
        }
        into layout.buildDirectory.dir("run/quilt/mods")
    }

    loom.runs.configureEach {
        runDir "build/run/quilt"
    }
    tasks.matching { it.name.startsWith("run") }.configureEach {
        dependsOn prepareQuiltRunMods
    }
    tasks.withType(JavaExec).matching { it.name.startsWith('run') }.configureEach {
        // Store transformed classes directly; referenced caches fail to reopen.
        if (project.minecraft_version in ['26.2', '26.3']) {
            jvmArgs '-Dloader.transform_cache.disable_external_references=true'
        }
        jvmArgs '-Dloader.disable_forked_guis=true'
    }
}

apply from: rootProject.file('gradle/forge-assets.gradle')

def compatibilityRunDir = project.minecraft_version in ['26.2', '26.3']
        ? file("build/run/${loaderPlatform}")
        : (loaderPlatform == 'fabric' ? rootProject.file('run') : file('build/run/quilt'))

def essentialRuntimePointer = layout.buildDirectory.file("essential-runtime-jar.path")
tasks.register("stageEssentialRuntimeJar") {
    dependsOn tasks.named("jar")
    def sourceJar = tasks.named("jar", Jar).flatMap { it.archiveFile }
    inputs.file(sourceJar)
    outputs.file(essentialRuntimePointer)
    outputs.upToDateWhen {
        def pointer = essentialRuntimePointer.get().asFile
        pointer.isFile() && file(pointer.text.trim()).isFile()
    }
    doLast {
        def source = sourceJar.get().asFile
        def digest = java.security.MessageDigest.getInstance("SHA-256")
        source.withInputStream { input ->
            input.transferTo(new java.security.DigestOutputStream(java.io.OutputStream.nullOutputStream(), digest))
        }
        def token = java.util.HexFormat.of().formatHex(digest.digest())
        def target = rootProject.file("run/.asterion-runtime/${token}/${source.name}")
        target.parentFile.mkdirs()
        if (!target.isFile()) java.nio.file.Files.copy(source.toPath(), target.toPath())
        essentialRuntimePointer.get().asFile.text = target.absolutePath
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            groupId = project.maven_group
            artifactId = project.archives_base_name
            from components.java
        }
    }

}

loom {
    fabricModJsonPath = rootProject.file("src/main/resources/fabric.mod.json")
    mods {
        asterion { sourceSet sourceSets.main }
    }
    runs {
        client {
            runDir(compatibilityRunDir.absolutePath)
            mainClass = "net.krodark.asterion.dev.EssentialClientLaunch"
            vmArg "-Dasterion.essential.modJarPathFile=${essentialRuntimePointer.get().asFile.absolutePath}"
            if (project.hasProperty('startupProfile')) vmArg "-XX:StartFlightRecording=settings=profile,filename=${layout.buildDirectory.file('startup-profile.jfr').get().asFile.absolutePath},dumponexit=true"
            if (project.minecraft_version in ['26.2', '26.3']) {
                programArg '--graphicsBackend'
                programArg providers.gradleProperty('graphics_backend').getOrElse('opengl').toUpperCase()
                vmArg "-Dmax.bg.threads=${providers.gradleProperty('client_worker_count').getOrElse('4')}"
            }
            ideConfigGenerated = false
        }
        essentialClient {
            client()
            name = "Minecraft Client with Essential"
            vmArg "-Dasterion.essential.modJarPathFile=${essentialRuntimePointer.get().asFile.absolutePath}"

            mainClass = "net.krodark.asterion.dev.EssentialClientLaunch"
            runDir(compatibilityRunDir.absolutePath)
            if (project.minecraft_version in ['26.2', '26.3']) {
                programArg '--graphicsBackend'
                programArg providers.gradleProperty('graphics_backend').getOrElse('opengl').toUpperCase()
                vmArg "-Dmax.bg.threads=${providers.gradleProperty('client_worker_count').getOrElse('4')}"
            }
            ideConfigGenerated = false
        }
    }
}

tasks.matching { it.name in ["runClient", "runEssentialClient"] }.configureEach { dependsOn "stageEssentialRuntimeJar" }

def asterionClientLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
    vendor = JvmVendorSpec.JETBRAINS
}

tasks.withType(JavaExec).configureEach {
    if (providers.gradleProperty('asterionUseJetBrainsRuntime').getOrElse('false').toBoolean()) {
        javaLauncher = asterionClientLauncher
    }
    doFirst {
        if (providers.gradleProperty('asterionSafeJvm').getOrElse('false').toBoolean()
                && allJvmArgs.any { it == '-Dfabric.dli.env=client' }) {
            setJvmArgs(jvmArgs.findAll { !it.startsWith('-XX:TieredStopAtLevel=') })
            def safeTier = providers.gradleProperty('asterionSafeJvmTier').getOrElse('1')
            if (!(safeTier in ['1', '3'])) throw new GradleException('asterionSafeJvmTier must be 1 or 3')
            jvmArgs "-XX:TieredStopAtLevel=${safeTier}"
            // Temurin 25.0.2 can crash in its getCallerClass intrinsic when C1 compiles
            // MemorySegment.reinterpret. Minecraft hits this path from BufferBuilder while
            // rendering option-screen text, so keep this one tiny method interpreted.
            jvmArgs '-XX:CompileCommand=exclude,jdk.internal.foreign.AbstractMemorySegmentImpl::reinterpret'
            logger.lifecycle("Asterion client stability mode: C1 tier ${safeTier}; crash-prone C2 tier disabled.")
        }
    }
    if (name == 'net.fabricmc.devlaunchinjector.Main.main()') {
        dependsOn 'stageEssentialRuntimeJar'
        doFirst {
            if (allJvmArgs.any { it == '-Dfabric.dli.env=client' }) {
                setJvmArgs(jvmArgs.findAll { !it.startsWith('-Dfabric.dli.main=') && !it.startsWith('-Dasterion.essential.modJar=') && !it.startsWith('-Dasterion.essential.modJarPathFile=') })
                systemProperty 'fabric.dli.main', 'net.krodark.asterion.dev.EssentialClientLaunch'
                systemProperty 'asterion.essential.modJarPathFile', essentialRuntimePointer.get().asFile.absolutePath
            }
        }
    }
}

tasks.register("modDistribution", Sync) {
    group = "distribution"
    description = "Stages the self-contained Asterion jar and installation notes."
    dependsOn tasks.named("jar")
    into layout.buildDirectory.dir("distribution")
    from(tasks.named("jar"))
    from(rootProject.file("docs/INSTALL-MODS.txt"))
}

// Remove the retired dimension resource from incremental resource outputs.
tasks.named('processResources').configure {
    doLast { delete file("${destinationDir}/data/asterion/dimension/asterion_dimension.json") }
}
