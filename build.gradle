apply from: rootProject.file('gradle/distribution.gradle')

// Match Minecraft's runtime and native libraries, including Sodium's checks.
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(minecraft_version == '1.20.1' ? 17 : 21) }
}

apply from: rootProject.file('gradle/production-smoke.gradle')
