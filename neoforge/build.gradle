plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_version}"
    id 'idea'
}

version = rootProject.mod_version
group = rootProject.maven_group

base {
    archivesName = rootProject.archives_base_name
}

repositories {
    maven { name = "Fabric"; url = "https://maven.fabricmc.net/" }
    maven { name = "Sinytra"; url = "https://maven.sinytra.org" }
    maven { name = "GeckoLib"; url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
    maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/releases/" }
    maven { name = "BlameJared"; url = "https://maven.blamejared.com/" }
    maven { name = "Shedaniel"; url = "https://maven.shedaniel.me/" }
    maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
}

sourceSets {
    main {
        java {
            srcDir rootProject.file("src/main/java")
            exclude "net/krodark/asterion/dev/**"
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

neoForge {
    version = rootProject.neoforge_version
    interfaceInjectionData.from project.file("geckolib_interfaces.json")

    runs {
        client {
            client()
            ideName = "Asterion NeoForge Client"
            gameDirectory = project.file("run/client")
        }
        server {
            server()
            ideName = "Asterion NeoForge Server"
            gameDirectory = project.file("run/server")
            programArgument "--nogui"
        }
    }

    mods {
        asterion {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:${rootProject.forgified_fabric_api_version}"
    implementation "com.geckolib:geckolib-neoforge-${rootProject.minecraft_version}:${rootProject.geckolib_version}"
    implementation files(rootProject.file("libs/amnetic-neoforge-1.0-SNAPSHOT.jar"))

    // Shared optional integrations are compiled but remain optional at runtime.
    compileOnly "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    compileOnly "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
    compileOnly "mezz.jei:jei-${rootProject.minecraft_version}-fabric-api:${rootProject.jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rootProject.rei_version}"
    compileOnly "dev.architectury:architectury-fabric:${rootProject.architectury_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"
    compileOnly "maven.modrinth:jade:${rootProject.jade_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.addAll(["-Xlint:deprecation", "-Xlint:unchecked"])
    options.release.set(25)
}

tasks.withType(ProcessResources).configureEach {
    dependsOn rootProject.tasks.named("processResources")
    inputs.property "version", project.version
    inputs.property "minecraft_version", rootProject.minecraft_version
    inputs.property "neoforge_version", rootProject.neoforge_version
    from(rootProject.layout.buildDirectory.dir("resources/main")) {
        exclude "fabric.mod.json"
    }
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version,
                "minecraft_version": rootProject.minecraft_version,
                "neoforge_version": rootProject.neoforge_version
    }
}

tasks.named("jar", Jar) {
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-neoforge-mc${rootProject.minecraft_version}.jar"
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest {
        attributes(
                'Implementation-Title': 'Asterion',
                'Implementation-Version': project.version.toString(),
                'Minecraft-Version': rootProject.minecraft_version.toString(),
                'Mod-Loader': 'NeoForge'
        )
    }
    from(rootProject.file("LICENSE.txt")) {
        rename { "LICENSE_${rootProject.archives_base_name}.txt" }
    }
}

tasks.register("modDistribution", Sync) {
    group = "distribution"
    dependsOn tasks.named("jar")
    into layout.buildDirectory.dir("distribution")
    from(tasks.named("jar"))
    from(rootProject.file("libs/amnetic-neoforge-1.0-SNAPSHOT.jar"))
    from(rootProject.file("docs/INSTALL-MODS.txt"))
}
