// Shared by the Underworld and 1.5 Gradle builds. Keep only Asterion artifacts
// on the repository shelf; dependencies remain in Gradle caches and profiles.
def shelf = new File(settingsDir, 'modbuilds')
while (!new File(shelf.parentFile, 'ports/1.5').isDirectory()) {
    if (shelf.parentFile.parentFile == null) throw new GradleException('Cannot find the Asterion repository root')
    shelf = new File(shelf.parentFile.parentFile, 'modbuilds')
}
def outputShelf = shelf
apply from: new File(outputShelf.parentFile, 'gradle/repair-embedded-startup.gradle')
def repairEmbedded = extensions.extraProperties.get('repairEmbeddedStartup')
def composeRendererLayers = extensions.extraProperties.get('composeRendererLayers')

// Standard ZIP DEFLATE at its strongest level; mod loaders cannot read LZMA/Zstd JARs.
def compressModJar = { File archive, File windowClass = null ->
    def packed = new File(archive.parentFile, archive.name + '.deflate.tmp')
    def expected = [:]
    boolean repairedArchive = false
    try {
        new java.util.zip.ZipFile(archive).withCloseable { input ->
            new java.util.zip.ZipOutputStream(new BufferedOutputStream(new FileOutputStream(packed))).withCloseable { output ->
                output.setLevel(java.util.zip.Deflater.BEST_COMPRESSION)
                input.entries().each { original ->
                    def entry = new java.util.zip.ZipEntry(original)
                    entry.setMethod(java.util.zip.ZipEntry.DEFLATED)
                    entry.setCompressedSize(-1)
                    byte[] repaired = null
                    if (original.name == 'com/meekdev/amnetic/mixin/LivingEntityRendererMixin.class') {
                        byte[] content = input.getInputStream(original).withCloseable { it.readAllBytes() }
                        repaired = composeRendererLayers(content)
                        if (!repaired.is(content)) repairedArchive = true
                    }
                    if (original.name.endsWith('.jar') && (original.name.contains('amnetic') || original.name.contains('lwjgl-assimp-'))) {
                        byte[] embedded = input.getInputStream(original).withCloseable { it.readAllBytes() }
                        repaired = repairEmbedded(embedded, original.name, windowClass?.bytes)
                        if (!repaired.is(embedded)) repairedArchive = true
                    }
                    if (repaired != null) {
                        def crc = new java.util.zip.CRC32(); crc.update(repaired)
                        expected[entry.name] = [repaired.length as long, crc.value]
                    } else expected[entry.name] = [original.size, original.crc]
                    output.putNextEntry(entry)
                    if (repaired != null) output.write(repaired)
                    else input.getInputStream(original).withCloseable { stream -> stream.transferTo(output) }
                    output.closeEntry()
                }
            }
        }
        new java.util.zip.ZipFile(packed).withCloseable { verified ->
            if (verified.size() != expected.size()) throw new GradleException('Compressed mod lost archive entries')
            verified.entries().each { entry ->
                if (expected[entry.name] != [entry.size, entry.crc])
                    throw new GradleException("Compressed mod changed ${entry.name}")
            }
        }
        if (packed.length() < archive.length() || repairedArchive) {
            long saved = archive.length() - packed.length()
            java.nio.file.Files.move(packed.toPath(), archive.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle("Prepared ${archive.name}: embedded startup repairs=${repairedArchive}, compression delta=${saved} bytes")
        }
    } finally { java.nio.file.Files.deleteIfExists(packed.toPath()) }
}

gradle.projectsEvaluated {
    gradle.rootProject.allprojects.each { modProject ->
        // These protections belong to the release ports, including new versions such as 1.6.
        boolean releasePort = modProject.rootProject.projectDir.canonicalFile.toPath().startsWith(
                new File(outputShelf.parentFile, 'ports/1.5').canonicalFile.toPath())
        // Legacy NeoForge's plugin registers an empty jarJar task; its finished
        // production archive is reobfJar. Collecting jarJar silently drops it.
        def taskName = modProject.name == '1.20.1-forge' && modProject.tasks.findByName('reobfJar') != null ? 'reobfJar' :
                modProject.tasks.findByName('integratedJar') != null ? 'integratedJar' :
                modProject.name == '1.20.1-neoforge' && modProject.tasks.findByName('reobfJar') != null ? 'reobfJar' :
                modProject.tasks.findByName('jarJar') instanceof org.gradle.api.tasks.bundling.AbstractArchiveTask ? 'jarJar' :
                modProject.tasks.findByName('reobfJar') != null ? 'reobfJar' :
                modProject.tasks.findByName('remapJar') != null ? 'remapJar' :
                modProject.tasks.findByName('jar') != null ? 'jar' : null
        if (taskName == null || modProject == gradle.rootProject) return

        if (releasePort) {
            modProject.tasks.withType(org.gradle.language.jvm.tasks.ProcessResources).configureEach {
                exclude 'data/asterion/dimension/limbo.json', 'data/asterion/dimension/underworld.json'
                exclude 'data/asterion/dimension_type/limbo.json', 'data/asterion/dimension_type/underworld.json'
                exclude 'data/asterion/worldgen/biome/limbo.json'
            }
            modProject.tasks.withType(org.gradle.api.tasks.bundling.Jar).configureEach {
                exclude 'data/asterion/dimension/limbo.json', 'data/asterion/dimension/underworld.json'
                exclude 'data/asterion/dimension_type/limbo.json', 'data/asterion/dimension_type/underworld.json'
                exclude 'data/asterion/worldgen/biome/limbo.json'
            }
        }
        def artifact = modProject.tasks.named(taskName)
        if (releasePort) {
            artifact.configure {
                doLast {
                    // Check the bytes being shipped, including nested renderer code.
                    // A stale local renderer must not silently undo the preset fix.
                    new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { release ->
                        def renderers = release.entries().findAll {
                            it.name ==~ /META-INF\/(jars|jarjar)\/amnetic[^\/]*\.jar/
                        }
                        if (modProject.findProperty('asterionIntegratedAmnetic') == true) {
                            if (!renderers.empty) throw new GradleException('Integrated release contains a nested Amnetic jar')
                            def metadata = new groovy.json.JsonSlurper().parse(release.getInputStream(release.getEntry('fabric.mod.json')))
                            if (metadata.depends.containsKey('amnetic') ||
                                    metadata.entrypoints.client.count { it == 'com.meekdev.amnetic.client.AmneticClient' } != 1 ||
                                    !metadata.mixins.contains('amnetic.mixins.json'))
                                throw new GradleException('Integrated renderer bootstrap is incomplete')
                            metadata.jars.each {
                                if (release.getEntry(it.file) == null) throw new GradleException("Missing integrated dependency: ${it.file}")
                            }
                            ['com/meekdev/amnetic/client/AmneticClient.class', 'amnetic.mixins.json',
                             'META-INF/asterion/amnetic-integration.txt'].each {
                                if (release.getEntry(it) == null) throw new GradleException("Missing integrated runtime: ${it}")
                            }
                            release.entries().each { entry ->
                                if (entry.name.endsWith('.class')) {
                                    def code = new String(release.getInputStream(entry).readAllBytes(), java.nio.charset.StandardCharsets.ISO_8859_1)
                                    if (entry.name.startsWith('com/meekdev/amnetic/client/ui/') ||
                                            entry.name.startsWith('com/meekdev/amnetic/client/particle/editor/') ||
                                            code.contains('com/meekdev/amnetic/client/ui/') ||
                                            code.contains('com/meekdev/amnetic/client/particle/editor/'))
                                        throw new GradleException("Removed editor code remains in ${entry.name}")
                                }
                            }
                            return
                        }
                        if (renderers.size() != 1) throw new GradleException('Expected one bundled Amnetic renderer')
                        release.getInputStream(renderers[0]).withCloseable { bytes ->
                            new java.util.zip.ZipInputStream(bytes).withCloseable { nested ->
                                boolean helper = false, guarded = false
                                for (def entry = nested.nextEntry; entry != null; entry = nested.nextEntry) {
                                    def prefix = 'com/meekdev/amnetic/client/particle/editor/'
                                    if (entry.name == prefix + 'EffectPresetFiles.class') helper = true
                                    if (entry.name == prefix + 'EffectIO.class') {
                                        def code = new String(nested.readAllBytes(), java.nio.charset.StandardCharsets.ISO_8859_1)
                                        guarded = code.contains('SafePresetIO') && code.contains('validateName') && !code.contains('java/nio/file/Files')
                                    }
                                }
                                if (!helper || !guarded) throw new GradleException('Bundled Amnetic lacks safe preset storage; repair renderer inputs before release')
                            }
                        }
                    }
                }
            }
        }
        def windowPatch = null
        def windowClass = null
        if (releasePort && modProject.name.startsWith('26.1.2-')) {
            windowClass = modProject.layout.buildDirectory.file('renderer-patches/com/meekdev/amnetic/mixin/WindowGlContextMixin.class').get().asFile
            windowPatch = modProject.tasks.register('compileEmbeddedWindowPatch', org.gradle.api.tasks.compile.JavaCompile) {
                source new File(outputShelf.parentFile, 'gradle/renderer-patches/WindowGlContextMixin.java')
                classpath = modProject.sourceSets.main.compileClasspath
                javaCompiler.set(modProject.tasks.named('compileJava', org.gradle.api.tasks.compile.JavaCompile).flatMap { it.javaCompiler })
                destinationDirectory = modProject.layout.buildDirectory.dir('renderer-patches')
                options.encoding = 'UTF-8'
                options.compilerArgs.add('-proc:none')
            }
        }
        def collect = modProject.tasks.register('collectModJar', Copy) {
            group = 'distribution'
            description = 'Copy the finished Asterion jar to the repository modbuilds folder.'
            dependsOn artifact
            from artifact.flatMap { it.archiveFile }
            into outputShelf
        }
        artifact.configure {
            inputs.file(new File(outputShelf.parentFile, 'gradle/repair-embedded-startup.gradle'))
            inputs.property('embeddedStartupRepair', 1)
            if (windowPatch != null) dependsOn windowPatch
            doLast { compressModJar(archiveFile.get().asFile, windowClass) }
            finalizedBy collect
        }

        // The older Fabric builds also produce a Quilt-labelled compatible jar.
        def quilt = modProject.tasks.findByName('quiltCompatibleJar')
        if (quilt != null) {
            quilt.doLast {
                compressModJar(modProject.layout.buildDirectory.file("quilt/Asterion-${modProject.version}-quilt-mc${modProject.minecraft_version}.jar").get().asFile, windowClass)
            }
            def collectQuilt = modProject.tasks.register('collectQuiltJar', Copy) {
                group = 'distribution'
                description = 'Copy the Quilt-compatible jar to the repository modbuilds folder.'
                dependsOn quilt
                from modProject.layout.buildDirectory.file("quilt/Asterion-${modProject.version}-quilt-mc${modProject.minecraft_version}.jar")
                into outputShelf
            }
            quilt.finalizedBy collectQuilt
            modProject.tasks.named('build').configure { finalizedBy quilt }
        }
    }
}
