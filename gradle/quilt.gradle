repositories { maven { url = 'https://maven.quiltmc.org/repository/release/' } }
configurations { quiltLoader }
dependencies {
    quiltLoader 'org.quiltmc:quilt-loader:0.30.1'
    quiltLoader 'org.quiltmc:quilt-json5:1.0.4+final'
    quiltLoader 'org.quiltmc:quilt-config:1.3.3'
}
['GameTest':'server', 'Client':'client', 'SmokeClient':'client'].each { suffix, side ->
    def fabricRun = tasks.named("run${suffix}")
    tasks.register("runQuilt${suffix}", JavaExec) {
        group = 'verification'
        description = "Run the ${side} on Quilt using the Fabric artifact's shared code."
        dependsOn { fabricRun.get().taskDependencies.getDependencies(fabricRun.get()) }
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(minecraft_version == '1.20.1' ? 17 : 21) }
        mainClass = side == 'client' ? 'org.quiltmc.loader.impl.launch.knot.KnotClient' : 'org.quiltmc.loader.impl.launch.knot.KnotServer'
        workingDir = layout.buildDirectory.dir("run/quilt${suffix}").get().asFile
        doFirst {
            workingDir.mkdirs()
            def original = fabricRun.get()
            classpath = original.classpath.filter { !it.name.startsWith('fabric-loader-') } + configurations.quiltLoader
            def config = rootProject.file(".gradle/loom-cache/projects/${project.name}/launch.cfg")
            def section = ''
            def launchArgs = []
            config.eachLine('UTF-8') { line ->
                if (!line.startsWith('\t')) section = line.trim()
                else if (section == 'commonProperties' || section == "${side}Properties") {
                    def entry = line.trim().split('=', 2)
                    systemProperty entry[0], entry[0] == 'log4j.configurationFile' ? new File(entry[1]).toURI().toString() : entry[1]
                    if (entry[0].startsWith('fabric.')) systemProperty 'loader.' + entry[0].substring(7), entry[1]
                } else if (section == "${side}Args" || section == 'commonArgs') launchArgs.add(line.trim())
            }
            args = launchArgs
            systemProperty 'loader.noGui', 'true'
            systemProperty 'loader.development', 'true'
            if (suffix == 'SmokeClient') {
                systemProperty 'asterion.clientSmoke', 'true'
                if (project.hasProperty('bloomSmoke')) systemProperty 'asterion.bloomSmoke', 'true'
                if (project.hasProperty('atmosphereSmoke')) systemProperty 'asterion.atmosphereSmoke', 'true'
            }
            if (suffix == 'GameTest') {
                systemProperty 'fabric-api.gametest', ''
                def properties = new File(workingDir, 'server.properties')
                if (!properties.exists()) properties.text = 'online-mode=false\n'
            }
        }
    }
}
