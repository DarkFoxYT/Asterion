import java.util.zip.*
import java.util.jar.Manifest
import org.objectweb.asm.*
import org.objectweb.asm.tree.*

buildscript {
    repositories { mavenCentral() }
    dependencies { classpath 'org.ow2.asm:asm-tree:9.9.1' }
}

// Preserve every existing renderer hook; compose only the legacy layer-visibility
// result after other mods' redirects instead of competing to replace their call.
def composeLayers = { byte[] original ->
    def node = new ClassNode(Opcodes.ASM9)
    new ClassReader(original).accept(node, ClassReader.EXPAND_FRAMES)
    def method = node.methods.find { it.name == 'amnetic$hideLayers'
            && Type.getArgumentTypes(it.desc).length == 1 && Type.getReturnType(it.desc) == Type.BOOLEAN_TYPE }
    if (method == null) return original
    def redirect = method.visibleAnnotations?.find { it.desc == 'Lorg/spongepowered/asm/mixin/injection/Redirect;' }
    if (redirect == null) return original
    String entity = Type.getArgumentTypes(method.desc)[0].internalName
    redirect.desc = 'Lcom/llamalad7/mixinextras/injector/ModifyExpressionValue;'
    method.desc = '(Z' + method.desc.substring(1)
    int calls = 0
    method.instructions.toArray().each { instruction ->
        if (instruction instanceof VarInsnNode && instruction.var >= 1) instruction.var++
        if (instruction instanceof IincInsnNode && instruction.var >= 1) instruction.var++
        if (instruction instanceof FrameNode) instruction.local.add(1, Opcodes.INTEGER)
        if (instruction instanceof MethodInsnNode && instruction.owner == entity && instruction.desc == '()Z') {
            def replacement = new InsnList()
            replacement.add(new InsnNode(Opcodes.POP))
            replacement.add(new VarInsnNode(Opcodes.ILOAD, 1))
            method.instructions.insertBefore(instruction, replacement)
            method.instructions.remove(instruction)
            calls++
        }
    }
    if (calls != 1) throw new GradleException('Unexpected Amnetic layer visibility hook; refusing a partial patch')
    method.localVariables?.each { if (it.index >= 1) it.index++ }
    method.maxLocals++
    method.parameters = null
    def output = new ClassWriter(0)
    node.accept(output)
    output.toByteArray()
}
ext.composeRendererLayers = composeLayers

// This is Asterion's maintained, embedded renderer distribution. Replace the
// upstream standalone-distribution notice with an accurate integration notice.
def embeddedNotice = { byte[] original ->
    def node = new ClassNode(Opcodes.ASM9)
    new ClassReader(original).accept(node, 0)
    def method = node.methods.find { it.name == 'warnIfNested' && it.desc == '()V' }
    if (method == null || !node.methods.any { candidate -> candidate.instructions.toArray().any {
            it instanceof LdcInsnNode && it.cst instanceof String && it.cst.contains('bundled dependency') } }) return original
    node.methods.removeAll { it.name.startsWith('lambda$warnIfNested$') }
    method.instructions.clear()
    method.tryCatchBlocks.clear()
    method.localVariables?.clear()
    method.instructions.add(new LdcInsnNode('Amnetic'))
    method.instructions.add(new MethodInsnNode(Opcodes.INVOKESTATIC, 'org/slf4j/LoggerFactory',
            'getLogger', '(Ljava/lang/String;)Lorg/slf4j/Logger;', false))
    method.instructions.add(new LdcInsnNode('Using Asterion\'s embedded custom Amnetic renderer'))
    method.instructions.add(new MethodInsnNode(Opcodes.INVOKEINTERFACE, 'org/slf4j/Logger',
            'info', '(Ljava/lang/String;)V', true))
    method.instructions.add(new InsnNode(Opcodes.RETURN))
    method.maxStack = 2
    method.maxLocals = 0
    def writer = new ClassWriter(0)
    node.accept(writer)
    writer.toByteArray()
}
ext.prepareEmbeddedRendererNotice = embeddedNotice

// Repair only embedded rendering libraries. Keep their dependency coordinates
// intact so Forge/NeoForge can still deduplicate them with other mods.
ext.repairEmbeddedStartup = { byte[] original, String name, byte[] windowPatch ->
    Closure repair
    repair = { byte[] bytes, String archiveName ->
        boolean assimp = archiveName.contains('lwjgl-assimp-') && !archiveName.contains('-natives-')
        boolean changed = false
        def buffer = new ByteArrayOutputStream()
        new ZipOutputStream(buffer).withCloseable { output ->
            output.setLevel(Deflater.BEST_COMPRESSION)
            new ZipInputStream(new ByteArrayInputStream(bytes)).withCloseable { input ->
                ZipEntry entry
                while ((entry = input.nextEntry) != null) {
                    byte[] content = input.readAllBytes()
                    if (entry.name == 'com/meekdev/amnetic/Amnetic.class') {
                        byte[] prepared = embeddedNotice(content)
                        if (!prepared.is(content)) { content = prepared; changed = true }
                    }
                    if (entry.name == 'com/meekdev/amnetic/mixin/LivingEntityRendererMixin.class') {
                        byte[] composed = composeLayers(content)
                        if (!composed.is(content)) { content = composed; changed = true }
                    }
                    if (archiveName.contains('amnetic-forge-') && archiveName.contains('1.20.1') && entry.name == 'amnetic.mixins.json') {
                        def config = new groovy.json.JsonSlurper().parse(content)
                        if (!config.refmap) {
                            config.refmap = 'main.refmap.json'
                            content = groovy.json.JsonOutput.toJson(config).getBytes('UTF-8')
                            changed = true
                        }
                    }
                    if (assimp && (entry.name == 'module-info.class' || entry.name.endsWith('/module-info.class'))) {
                        changed = true
                        continue
                    }
                    if (assimp && entry.name == 'META-INF/MANIFEST.MF') {
                        def manifest = new Manifest(new ByteArrayInputStream(content))
                        if (manifest.mainAttributes.getValue('Automatic-Module-Name') != 'org.lwjgl.assimp') {
                            manifest.mainAttributes.putValue('Automatic-Module-Name', 'org.lwjgl.assimp')
                            def encoded = new ByteArrayOutputStream()
                            manifest.write(encoded)
                            content = encoded.toByteArray()
                            changed = true
                        }
                    }
                    if (windowPatch != null && entry.name == 'com/meekdev/amnetic/mixin/WindowGlContextMixin.class') {
                        // Fixed releases already compose with Sodium. Replace only
                        // the old Redirect implementation in the 26.1.2 renderer.
                        if (new String(content, java.nio.charset.StandardCharsets.ISO_8859_1).contains('injection/Redirect')) {
                            content = windowPatch
                            changed = true
                        }
                    }
                    if (entry.name.endsWith('.jar') && (entry.name.contains('amnetic') || entry.name.contains('lwjgl-assimp-'))) {
                        byte[] nested = repair(content, entry.name)
                        if (!nested.is(content)) { content = nested; changed = true }
                    }
                    def copy = new ZipEntry(entry.name)
                    copy.time = 0L
                    output.putNextEntry(copy)
                    output.write(content)
                    output.closeEntry()
                }
            }
        }
        changed ? buffer.toByteArray() : bytes
    }
    repair(original, name)
}
