pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.kikugie.dev/releases' }
        maven { url = 'https://maven.sinytra.org/' }
        gradlePluginPortal()
    }
}
plugins {
    id 'dev.kikugie.stonecutter' version '0.9.8'
}
apply from: file('../../tools/collect-mod-builds.settings.gradle')
stonecutter {
    create(rootProject) {
        versions('1.20.1', '1.21.1')
        version('1.20.1-forge', '1.20.1').buildscript = 'forge/build.gradle'
        version('1.20.1-neoforge', '1.20.1').buildscript = 'neolegacy/build.gradle'
        version('1.21.1-forge', '1.21.1').buildscript = 'forge/build.gradle'
        vcsVersion = '1.21.1'
    }
}
include 'neoforge'
