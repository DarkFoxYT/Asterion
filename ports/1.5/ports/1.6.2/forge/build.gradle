plugins {
    id 'java'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.29,8)'
    id 'net.minecraftforge.jarjar' version '0.2.3'
    id 'net.minecraftforge.renamer' version '1.0.14'
}
jarJar.register()

version = project.mod_version
group = rootProject.maven_group
base.archivesName = 'Asterion-forge'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://maven.sinytra.org/' }
}

minecraft {
    if (minecraft_version == '1.21.11') mappings channel: 'official', version: minecraft_version
    facade = files(rootProject.file(minecraft_version == '1.21.11' ? 'forge/src/main/resources/asterion12111.facade.cfg' : 'forge/src/main/resources/asterion.facade.cfg'))
    runs {
        configureEach {
            mods { asterion { source sourceSets.main } }
            args '--mixin.config=asterion.mixins.json'
            args '--mixin.config=asterion.forge.mixins.json'
        }
        register('client') { workingDir = layout.projectDirectory.dir('run/client') }
        register('server') {
            workingDir = layout.projectDirectory.dir('run/server')
            args '--nogui'
        }
    }
}

sourceSets.main {
    java {
        srcDir rootProject.file('forge/src/main/java')
        exclude 'net/krodark/asterion/neoforge/**'
        exclude 'net/krodark/asterion/dev/**'
        exclude 'net/krodark/asterion/compat/jei/**'
        exclude 'net/krodark/asterion/compat/rei/**'
        exclude 'net/krodark/asterion/compat/jade/**'
        exclude 'net/krodark/asterion/datagen/**'
        exclude 'net/krodark/asterion/client/AsterionModMenu.java'
        exclude '**/AsterionDataGenerator.java'
    }
    resources {
        srcDir rootProject.file('forge/src/main/resources')
        exclude 'fabric.mod.json'
        exclude 'META-INF/neoforge.mods.toml'
        exclude 'data/asterion/dimension/limbo.json'
        exclude 'data/asterion/dimension_type/limbo.json'
        exclude 'data/asterion/worldgen/biome/limbo.json'
    }
}

// Forge 26 scans each development mod path independently. Keep the mod
// metadata and annotated entrypoint together in the same output directory.
sourceSets.main.output.resourcesDir = sourceSets.main.java.destinationDirectory.get().asFile

// Apply current pack metadata to both development and embedded Amnetic.
def amneticPackMetadata = tasks.register('amneticPackMetadata') {
    def output = layout.buildDirectory.file('amnetic-pack/pack.mcmeta')
    inputs.properties(minecraft_version: minecraft_version, major: resource_pack_major, minor: resource_pack_minor)
    def rendererInput = rootProject.file("libs/amnetic-forge-${project.amnetic_version}.jar")
    inputs.file(rendererInput)
    outputs.dir(layout.buildDirectory.dir('amnetic-pack'))
    doLast {
        def target = output.get().asFile
        target.parentFile.mkdirs()
        def pack = [description: 'Amnetic resources',
                    min_format: minecraft_version == '1.21.11' ? [82, 0] : [97, 1],
                    max_format: minecraft_version == '1.21.11' ? [94, 1] : [121, 0]]
        // Forge wraps client resources; this range also parses for server data.
        target.text = groovy.json.JsonOutput.toJson([pack: pack])
        if (minecraft_version == '26.3') {
            // Vanilla supplies TinyFD. Forge's module resolver cannot load a
            // second copy from the renderer's nested dependencies.
            def inputZip = new java.util.zip.ZipFile(rendererInput)
            try {
                def metadata = new groovy.json.JsonSlurper().parse(inputZip.getInputStream(inputZip.getEntry('META-INF/jarjar/metadata.json')))
                metadata.jars.removeAll { it.identifier.group == 'org.lwjgl' && it.identifier.artifact == 'lwjgl-tinyfd' }
                def nestedMetadata = new File(target.parentFile, 'META-INF/jarjar/metadata.json')
                nestedMetadata.parentFile.mkdirs()
                nestedMetadata.text = groovy.json.JsonOutput.toJson(metadata)
                inputZip.entries().each { entry ->
                    if (entry.name.endsWith('mixins.json')) {
                        def config = new groovy.json.JsonSlurper().parse(inputZip.getInputStream(entry))
                        config.compatibilityLevel = 'JAVA_21'
                        def configFile = new File(target.parentFile, entry.name)
                        configFile.parentFile.mkdirs()
                        configFile.text = groovy.json.JsonOutput.toJson(config)
                    }
                }
            } finally { inputZip.close() }
        }
    }
}
def compatibleAmneticJar = tasks.register('compatibleAmneticJar', Zip) {
    dependsOn amneticPackMetadata
    from(zipTree(rootProject.file("libs/amnetic-forge-${project.amnetic_version}.jar"))) {
        exclude 'pack.mcmeta'
        if (minecraft_version == '26.3') exclude 'META-INF/jarjar/metadata.json', 'META-INF/jarjar/lwjgl-tinyfd-*.jar', '**mixins.json'
    }
    from(layout.buildDirectory.dir('amnetic-pack'))
    archiveFileName = "amnetic-forge-${project.amnetic_version}.jar"
    destinationDirectory = layout.buildDirectory.dir('compatible-amnetic')
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    compileOnly("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}") { transitive = true }
    compileOnly "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    compileOnly "${project.geckolib_group}:geckolib-forge-${minecraft_version}:${project.geckolib_version}"
    runtimeOnly "${project.geckolib_group}:geckolib-forge-${minecraft_version}:${project.geckolib_version}"
    compileOnly files(rootProject.file("libs/amnetic-forge-${project.amnetic_version}.jar"))
    runtimeOnly files(compatibleAmneticJar)
}
def amneticEmbed = dependencies.create(files(compatibleAmneticJar))
jarJar.configure(amneticEmbed) {
    module { group = 'com.meekdev'; name = 'amnetic-forge' }
    version = '1.0.0'
    range = '[1.0.0,)'
}
dependencies.add('jarJar', amneticEmbed)

// Loader-managed nested mods retain their own metadata, mixins and licences.
def geckolibEmbed = dependencies.create("${project.geckolib_group}:geckolib-forge-${minecraft_version}:${project.geckolib_version}") { transitive = false }
jarJar.configure(geckolibEmbed) {
    version = project.geckolib_version
    range = "[${project.geckolib_version}]"
}
dependencies.add('jarJar', geckolibEmbed)


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version as int
    options.compilerArgs.addAll(['-Xmaxerrs', '100000'])
}

processResources {
    inputs.properties(version: project.version.toString(), minecraft_version: minecraft_version, forge_version: forge_version, geckolib_version: geckolib_version)
    filesMatching('META-INF/mods.toml') {
        expand version: project.version, minecraft_version: minecraft_version, forge_version: forge_version, geckolib_version: geckolib_version
    }
}

jar {
    archiveFileName = "Asterion-${project.version}-forge-mc${minecraft_version}.jar"
    manifest { attributes 'MixinConfigs': 'asterion.mixins.json,asterion.forge.mixins.json' }
}
tasks.named('jarJar', Jar) {
    archiveFileName = "Asterion-${project.version}-forge-mc${minecraft_version}.jar"
    destinationDirectory = layout.buildDirectory.dir('packaged')
}

apply from: rootProject.file('gradle/port-api.gradle')
apply from: rootProject.file('gradle/loader-sources.gradle')
apply from: rootProject.file('gradle/port-smoke.gradle')
apply from: rootProject.file('gradle/port-mixin-smoke.gradle')
apply from: rootProject.file('gradle/private-forge-api.gradle')

tasks.withType(JavaExec).configureEach {
    if (project.java_version.toString() == '25' && name.toLowerCase().contains('client') && providers.gradleProperty('asterionUseJetBrainsRuntime').getOrElse('false').toBoolean()) {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(25)
            vendor = JvmVendorSpec.JETBRAINS
        }
    }
}
