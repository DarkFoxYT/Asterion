def serverSmokeSources = tasks.register('generateServerSmokeSources', Sync) {
    from(rootProject.file('../../neoforge/src/smoke/java')) {
        include '**/NeoServerSmoke.java'
        filter { line -> line.replace('.getTags()', '.entityTags()') }
    }
    into layout.buildDirectory.dir('generated/server-smoke')
}
sourceSets {
    serverSmoke {
        java.srcDirs = [serverSmokeSources, rootProject.file('../../src/regression/java'), rootProject.file('../../src/gametest/java')]
        java.include '**/NeoServerSmoke.java', '**/RagdollPoseTrackerChecks.java', '**/WeaponCombatRegression.java', '**/RetiredContentChecks.java'
        resources.setSrcDirs([rootProject.file('neoforge/src/serverSmoke/resources')])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
    packagedServerSmoke
}
neoForge.addModdingDependenciesTo(sourceSets.serverSmoke)
neoForge.addModdingDependenciesTo(sourceSets.packagedServerSmoke)
def serverHarness = tasks.register('serverSmokeHarnessJar', Jar) {
    from sourceSets.serverSmoke.output
    archiveClassifier = 'server-tests'
    destinationDirectory = layout.buildDirectory.dir('test-harness')
}
dependencies { packagedServerSmokeRuntimeOnly files(tasks.named('jar'), serverHarness) }
neoForge.runs {
    packagedSmokeServer {
        server()
        sourceSet = sourceSets.packagedServerSmoke
        loadedMods = []
        gameDirectory = layout.buildDirectory.dir('run/server-gameplay').get().asFile
        programArgument '--nogui'
    }
}
