plugins {
    id 'java'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.29,8)'
    id 'net.minecraftforge.jarjar' version '0.2.3'
    id 'net.minecraftforge.renamer' version '1.0.14'
}
jarJar.register()

version = rootProject.mod_version
group = rootProject.maven_group
base.archivesName = 'Asterion-forge'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://maven.sinytra.org/' }
}

minecraft {
    facade = files(rootProject.file('forge/src/main/resources/asterion.facade.cfg'))
    runs {
        configureEach {
            mods { asterion { source sourceSets.main } }
            args '--mixin.config=asterion.mixins.json'
            args '--mixin.config=asterion.forge.mixins.json'
        }
        register('client') { workingDir = layout.projectDirectory.dir('run/client') }
        register('server') {
            workingDir = layout.projectDirectory.dir('run/server')
            args '--nogui'
        }
    }
}

sourceSets.main {
    java {
        srcDir rootProject.file('forge/src/main/java')
        exclude 'net/krodark/asterion/neoforge/**'
        exclude 'net/krodark/asterion/dev/**'
        exclude 'net/krodark/asterion/compat/jei/**'
        exclude 'net/krodark/asterion/compat/rei/**'
        exclude 'net/krodark/asterion/compat/jade/**'
        exclude 'net/krodark/asterion/datagen/**'
        exclude 'net/krodark/asterion/client/AsterionModMenu.java'
    }
    resources {
        srcDir rootProject.file('forge/src/main/resources')
        exclude 'fabric.mod.json'
        exclude 'META-INF/neoforge.mods.toml'
        exclude 'data/asterion/dimension/limbo.json'
        exclude 'data/asterion/dimension_type/limbo.json'
        exclude 'data/asterion/worldgen/biome/limbo.json'
    }
}

// Forge 26 scans each development mod path independently. Keep the mod
// metadata and annotated entrypoint together in the same output directory.
sourceSets.main.output.resourcesDir = sourceSets.main.java.destinationDirectory.get().asFile

// Apply current pack metadata to both development and embedded Amnetic.
def amneticPackMetadata = tasks.register('amneticPackMetadata') {
    def output = layout.buildDirectory.file('amnetic-pack/pack.mcmeta')
    outputs.file(output)
    doLast {
        def target = output.get().asFile
        target.parentFile.mkdirs()
        target.text = groovy.json.JsonOutput.toJson([pack: [
                description: 'Amnetic resources', min_format: [101, 1], max_format: [101, 1]]])
    }
}
def compatibleAmneticJar = tasks.register('compatibleAmneticJar', Zip) {
    dependsOn amneticPackMetadata
    from(zipTree(rootProject.file('libs/amnetic-forge-26.1.2.jar'))) { exclude 'pack.mcmeta' }
    from(layout.buildDirectory.dir('amnetic-pack'))
    archiveFileName = 'amnetic-forge-26.1.2.jar'
    destinationDirectory = layout.buildDirectory.dir('compatible-amnetic')
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.1.2-64.1.3')
    compileOnly("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}") { transitive = true }
    compileOnly "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    compileOnly "com.geckolib:geckolib-forge-26.1.2:${rootProject.geckolib_version}"
    runtimeOnly "com.geckolib:geckolib-forge-26.1.2:${rootProject.geckolib_version}"
    compileOnly files(rootProject.file('libs/amnetic-forge-26.1.2.jar'))
    runtimeOnly files(compatibleAmneticJar)
}
def amneticEmbed = dependencies.create(files(compatibleAmneticJar))
jarJar.configure(amneticEmbed) {
    module { group = 'com.meekdev'; name = 'amnetic-forge' }
    version = '1.0.0'
    range = '[1.0.0,)'
}
dependencies.add('jarJar', amneticEmbed)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.addAll(['-Xmaxerrs', '100000'])
}

processResources {
    inputs.properties(version: project.version.toString(), minecraft_version: '26.1.2', forge_version: '64.1.3')
    filesMatching('META-INF/mods.toml') {
        expand version: project.version, minecraft_version: '26.1.2', forge_version: '64.1.3'
    }
}

jar {
    archiveFileName = "Asterion-${project.version}-forge-mc26.1.2.jar"
    manifest { attributes 'MixinConfigs': 'asterion.mixins.json,asterion.forge.mixins.json' }
}
tasks.named('jarJar', Jar) {
    archiveFileName = "Asterion-${project.version}-forge-mc26.1.2.jar"
    destinationDirectory = layout.buildDirectory.dir('packaged')
}
