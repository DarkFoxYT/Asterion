pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'Sinytra'; url = 'https://maven.sinytra.org/' }
        maven { name = 'KikuGie'; url = 'https://maven.kikugie.dev/releases' }
        gradlePluginPortal()
    }
}

plugins {
    // Provision the Java versions required by Minecraft and NeoForge's tools.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

rootProject.name = 'Asterion'
apply from: file('../../../../tools/collect-mod-builds.settings.gradle')
stonecutter {
    create(rootProject) {
        version('26.1.2-fabric', '26.1.2').buildscript = 'build.gradle'
        version('26.1.2-quilt', '26.1.2').buildscript = 'build.gradle'
        version('26.1.2-neoforge', '26.1.2').buildscript = 'neoforge/build.gradle'
        version('26.1.2-forge', '26.1.2').buildscript = 'forge/build.gradle'
        vcsVersion = '26.1.2-fabric'
    }
}
