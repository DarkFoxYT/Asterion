// Load the release JAR from the mod classpath, with no loose Asterion classes.
def packagedHarness = tasks.register('packagedSmokeHarnessJar', Jar) {
    from sourceSets.smoke.output
    archiveClassifier = 'packaged-smoke-tests'
    destinationDirectory = layout.buildDirectory.dir('test-harness')
}
sourceSets {
    packagedSmoke
    packagedServerSmoke
}
neoForge.addModdingDependenciesTo(sourceSets.packagedSmoke)
neoForge.addModdingDependenciesTo(sourceSets.packagedServerSmoke)
dependencies {
    packagedSmokeRuntimeOnly files(tasks.named('jar'), packagedHarness)
    packagedServerSmokeRuntimeOnly files(tasks.named('jar'))
    if (project.hasProperty('serverGameplaySmoke')) packagedServerSmokeRuntimeOnly files(packagedHarness)
}
neoForge.runs {
    packagedSmokeServer {
        server()
        sourceSet = sourceSets.packagedServerSmoke
        loadedMods = []
        gameDirectory = layout.buildDirectory.dir('run/packaged-smoke-server').get().asFile
        programArgument '--nogui'
    }
    packagedSmokeClient {
        client()
        sourceSet = sourceSets.packagedSmoke
        loadedMods = []
        gameDirectory = layout.buildDirectory.dir('run/packaged-smoke-client').get().asFile
        systemProperty 'asterion.clientSmoke', 'true'
        systemProperty 'asterion.nativeAmneticSmoke', 'true'
        systemProperty 'amnetic.opengl.debug', 'true'
        if (project.hasProperty('startupSmoke')) systemProperty 'asterion.startupSmoke', 'true'
        if (project.hasProperty('sodiumSmoke')) systemProperty 'asterion.sodiumSmoke', 'true'
        if (project.hasProperty('polishSmoke')) systemProperty 'asterion.polishSmoke', 'true'
        if (project.hasProperty('bloomSmoke')) systemProperty 'asterion.bloomSmoke', 'true'
        if (project.hasProperty('atmosphereSmoke')) systemProperty 'asterion.atmosphereSmoke', 'true'
        if (project.hasProperty('shaderPackSmoke')) systemProperty 'asterion.shaderPackSmoke', 'true'
        if (project.hasProperty('shaderFramebufferSmoke')) systemProperty 'asterion.shaderFramebufferSmoke', 'true'
    }
}
tasks.named('runPackagedSmokeServer', JavaExec).configure {
    standardInput = System.in
}
