// Required libraries are registered inside the production jar.
def nativeNeo = project.name == 'neoforge'
def mc = nativeNeo ? rootProject.minecraft_version : project.minecraft_version

tasks.register('stagePlayableBuild', Sync) {
    group = 'distribution'
    def production = tasks.named(nativeNeo ? 'jar' : (project.findProperty('asterionProductionJarTask') ?: 'remapJar'))
    dependsOn production
    into rootProject.layout.buildDirectory.dir("ported-builds/${mc}/${nativeNeo ? 'neoforge' : 'fabric-quilt'}")
    from(production) { into 'mods' }
    from(rootProject.file('docs/INSTALL-MODS.txt'))
}
// Authoring-only resources have target-version equivalents generated into geo,
// animations, and models/item. Keep sources intact, omit redundant release copies.
tasks.withType(Jar).configureEach {
    if (!name.toLowerCase().contains('sources')) {
        exclude 'assets/asterion/geckolib/**'
        exclude 'assets/asterion/items/**'
        exclude 'assets/asterion/equipment/**'
    }
}
